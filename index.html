<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GYMVERSE — 4D Fitness</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cyan: #00f5ff;
      --blue: #287bff;
      --purple: #9b5cff;
      --pink: #ff3cac;
      --bg: #03050c;
      --glass: rgba(255,255,255,.055);
      --border: rgba(255,255,255,.11);
      --muted: #8991a4;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Inter, sans-serif;
      background: var(--bg);
      color: white;
      overflow-x: hidden;
    }

    /* ==============================
       ANIMATED BACKGROUND
    ============================== */

    .background {
      position: fixed;
      inset: 0;
      z-index: -10;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(0,245,255,.12), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(155,92,255,.13), transparent 28%),
        radial-gradient(circle at 50% 100%, rgba(255,60,172,.08), transparent 30%),
        #03050c;
    }

    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.7) 1px, transparent 1px);
      background-size: 90px 90px;
      opacity: .18;
      animation: stars 20s linear infinite;
    }

    @keyframes stars {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(90px);
      }
    }

    .light {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      animation: lightMove 10s ease-in-out infinite alternate;
    }

    .light.one {
      width: 300px;
      height: 300px;
      background: rgba(0,245,255,.14);
      left: -100px;
      top: 20%;
    }

    .light.two {
      width: 400px;
      height: 400px;
      background: rgba(155,92,255,.12);
      right: -150px;
      top: 40%;
      animation-delay: -4s;
    }

    @keyframes lightMove {
      from {
        transform: translate3d(0,0,0);
      }
      to {
        transform: translate3d(100px,-80px,100px);
      }
    }

    /* ==============================
       NAVBAR
    ============================== */

    header {
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 999;
      padding: 18px 5%;
    }

    nav {
      max-width: 1250px;
      margin: auto;
      height: 65px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(10,13,25,.65);
      border: 1px solid var(--border);
      border-radius: 22px;
      backdrop-filter: blur(25px);
      box-shadow: 0 20px 70px rgba(0,0,0,.25);
    }

    .logo {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -1px;
    }

    .logo span {
      color: var(--cyan);
    }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      color: #aeb5c5;
      text-decoration: none;
      font-size: 13px;
      transition: .3s;
    }

    .nav-links a:hover {
      color: white;
    }

    .nav-join {
      color: white;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      padding: 11px 18px;
      border-radius: 12px;
      background: linear-gradient(100deg,var(--cyan),var(--blue));
      box-shadow: 0 0 25px rgba(0,245,255,.25);
    }

    /* ==============================
       HERO
    ============================== */

    .hero {
      min-height: 100vh;
      max-width: 1300px;
      margin: auto;
      padding: 150px 6% 80px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 60px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border-radius: 30px;
      background: rgba(0,245,255,.07);
      border: 1px solid rgba(0,245,255,.2);
      color: var(--cyan);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      margin-bottom: 25px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 15px var(--cyan);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      50% {
        opacity: .2;
        transform: scale(.6);
      }
    }

    .hero h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(55px,7vw,100px);
      line-height: .88;
      letter-spacing: -6px;
      margin-bottom: 30px;
    }

    .gradient {
      background: linear-gradient(
        90deg,
        #fff,
        var(--cyan),
        var(--purple),
        #fff
      );
      background-size: 250% auto;
      -webkit-background-clip: text;
      color: transparent;
      animation: gradientText 5s linear infinite;
    }

    @keyframes gradientText {
      to {
        background-position: 250% center;
      }
    }

    .hero p {
      color: var(--muted);
      max-width: 550px;
      line-height: 1.8;
      font-size: 15px;
      margin-bottom: 35px;
    }

    .hero-actions {
      display: flex;
      gap: 13px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 15px 22px;
      border-radius: 13px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: .35s;
    }

    .primary {
      color: #02050b;
      background: white;
      box-shadow: 0 0 35px rgba(255,255,255,.18);
    }

    .primary:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0,245,255,.25);
    }

    .secondary {
      color: white;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
    }

    .secondary:hover {
      border-color: var(--cyan);
    }

    /* ==============================
       4D HOLOGRAM
    ============================== */

    .holo-stage {
      height: 530px;
      position: relative;
      perspective: 1200px;
      display: grid;
      place-items: center;
    }

    .holo {
      width: 340px;
      height: 440px;
      position: relative;
      transform-style: preserve-3d;
      animation: holoFloat 6s ease-in-out infinite;
    }

    @keyframes holoFloat {
      0%,100% {
        transform: rotateY(-10deg) rotateX(4deg) translateY(0);
      }
      50% {
        transform: rotateY(15deg) rotateX(-5deg) translateY(-25px);
      }
    }

    .holo::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(0,245,255,.3);
      border-radius: 35px;
      box-shadow:
        0 0 80px rgba(0,245,255,.12),
        inset 0 0 70px rgba(0,245,255,.04);
      background:
        linear-gradient(
          135deg,
          rgba(0,245,255,.08),
          rgba(155,92,255,.04)
        );
      backdrop-filter: blur(12px);
    }

    .scan {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--cyan);
      box-shadow: 0 0 20px var(--cyan);
      z-index: 5;
      animation: scan 4s linear infinite;
    }

    @keyframes scan {
      0% {
        top: 5%;
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        top: 95%;
        opacity: 0;
      }
    }

    .holo-content {
      position: absolute;
      inset: 25px;
      z-index: 3;
      transform: translateZ(40px);
    }

    .profile {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
    }

    .avatar {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 23px;
      background: linear-gradient(135deg,var(--cyan),var(--purple));
      box-shadow: 0 0 30px rgba(0,245,255,.3);
    }

    .online {
      font-size: 10px;
      color: var(--cyan);
    }

    .holo-title {
      font-size: 12px;
      color: #8991a4;
      margin-bottom: 5px;
    }

    .holo-number {
      font-family: "Space Grotesk";
      font-size: 43px;
      font-weight: 700;
    }

    .holo-number span {
      font-size: 14px;
      color: var(--cyan);
    }

    .progress {
      height: 5px;
      background: rgba(255,255,255,.08);
      border-radius: 20px;
      margin: 18px 0 30px;
      overflow: hidden;
    }

    .progress i {
      display: block;
      width: 78%;
      height: 100%;
      background: linear-gradient(90deg,var(--cyan),var(--purple));
      box-shadow: 0 0 15px var(--cyan);
    }

    .metric {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .metric-box {
      padding: 17px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 15px;
    }

    .metric-box small {
      color: #71798c;
      font-size: 9px;
    }

    .metric-box strong {
      display: block;
      margin-top: 6px;
      font-size: 19px;
    }

    .floating-card {
      position: absolute;
      padding: 15px 18px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: rgba(10,14,25,.7);
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
      font-size: 11px;
      z-index: 10;
    }

    .floating-card.one {
      left: 0;
      top: 110px;
      animation: floatOne 4s ease-in-out infinite;
    }

    .floating-card.two {
      right: -10px;
      bottom: 100px;
      animation: floatTwo 5s ease-in-out infinite;
    }

    @keyframes floatOne {
      50% {
        transform: translate3d(-15px,-20px,70px);
      }
    }

    @keyframes floatTwo {
      50% {
        transform: translate3d(15px,15px,80px);
      }
    }

    .floating-card strong {
      display: block;
      font-size: 17px;
      color: var(--cyan);
    }

    /* ==============================
       SECTION
    ============================== */

    section {
      max-width: 1300px;
      margin: auto;
      padding: 110px 6%;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 30px;
      margin-bottom: 50px;
    }

    .section-head small {
      color: var(--cyan);
      font-size: 11px;
      letter-spacing: 2px;
    }

    .section-head h2 {
      font-family: "Space Grotesk";
      font-size: clamp(35px,5vw,65px);
      letter-spacing: -3px;
      margin-top: 8px;
    }

    .section-head p {
      max-width: 400px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    /* ==============================
       PROGRAMS
    ============================== */

    .programs {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 15px;
    }

    .program {
      height: 310px;
      padding: 25px;
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: linear-gradient(
        145deg,
        rgba(255,255,255,.07),
        rgba(255,255,255,.015)
      );
      transition: .5s;
      transform-style: preserve-3d;
    }

    .program:hover {
      transform: translateY(-12px) rotateX(3deg);
      border-color: rgba(0,245,255,.4);
      box-shadow: 0 30px 70px rgba(0,0,0,.35);
    }

    .program-number {
      font-size: 11px;
      color: #5f687c;
    }

    .program h3 {
      position: absolute;
      bottom: 55px;
      left: 25px;
      font-family: "Space Grotesk";
      font-size: 24px;
    }

    .program p {
      position: absolute;
      bottom: 25px;
      left: 25px;
      color: #7f8799;
      font-size: 10px;
    }

    .program-icon {
      position: absolute;
      right: 25px;
      top: 60px;
      font-size: 70px;
      opacity: .7;
      filter: drop-shadow(0 0 20px rgba(0,245,255,.4));
      transform: rotate(-15deg);
    }

    /* ==============================
       EXPERIENCE
    ============================== */

    .experience {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .experience-card {
      min-height: 300px;
      padding: 35px;
      border: 1px solid var(--border);
      border-radius: 25px;
      background: var(--glass);
      position: relative;
      overflow: hidden;
    }

    .experience-card::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(0,245,255,.12);
      filter: blur(50px);
      right: -70px;
      top: -70px;
    }

    .experience-card h3 {
      font-family: "Space Grotesk";
      font-size: 30px;
      margin-bottom: 15px;
    }

    .experience-card p {
      color: var(--muted);
      line-height: 1.8;
      font-size: 13px;
      max-width: 450px;
    }

    .big-number {
      position: absolute;
      right: 30px;
      bottom: 20px;
      font-family: "Space Grotesk";
      font-size: 100px;
      font-weight: 700;
      color: rgba(255,255,255,.04);
    }

    /* ==============================
       PRICING
    ============================== */

    .plans {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 18px;
    }

    .plan {
      padding: 35px;
      border: 1px solid var(--border);
      border-radius: 25px;
      background: rgba(255,255,255,.035);
      transition: .4s;
    }

    .plan:hover {
      transform: translateY(-8px);
    }

    .plan.featured {
      background:
        linear-gradient(
          145deg,
          rgba(0,245,255,.12),
          rgba(155,92,255,.07)
        );
      border-color: rgba(0,245,255,.4);
    }

    .plan h3 {
      font-family: "Space Grotesk";
      font-size: 21px;
    }

    .plan .price {
      font-family: "Space Grotesk";
      font-size: 50px;
      margin: 25px 0;
    }

    .plan .price span {
      font-size: 11px;
      color: #727a8b;
    }

    .plan ul {
      list-style: none;
      margin-bottom: 30px;
    }

    .plan li {
      color: #9098a9;
      font-size: 12px;
      padding: 11px 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .plan li::before {
      content: "✦";
      color: var(--cyan);
      margin-right: 9px;
    }

    .plan a {
      display: block;
      text-align: center;
      padding: 13px;
      color: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
    }

    .plan.featured a {
      color: #02050b;
      background: var(--cyan);
      border-color: var(--cyan);
    }

    /* ==============================
       CTA
    ============================== */

    .cta {
      padding: 90px 30px;
      text-align: center;
      border-radius: 30px;
      border: 1px solid rgba(0,245,255,.25);
      background:
        radial-gradient(circle at center, rgba(0,245,255,.12), transparent 50%),
        rgba(255,255,255,.025);
      overflow: hidden;
      position: relative;
    }

    .cta h2 {
      font-family: "Space Grotesk";
      font-size: clamp(40px,6vw,75px);
      letter-spacing: -4px;
      margin-bottom: 20px;
    }

    .cta p {
      color: var(--muted);
      margin-bottom: 30px;
    }

    /* ==============================
       CONTACT
    ============================== */

    .contact {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 50px;
    }

    .contact h2 {
      font-family: "Space Grotesk";
      font-size: 50px;
      letter-spacing: -3px;
      margin-bottom: 20px;
    }

    .contact > div > p {
      color: var(--muted);
      line-height: 1.8;
      font-size: 13px;
    }

    form {
      padding: 30px;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--glass);
      display: grid;
      gap: 13px;
    }

    input,
    textarea {
      width: 100%;
      padding: 16px;
      border: 1px solid rgba(255,255,255,.09);
      background: rgba(0,0,0,.25);
      color: white;
      border-radius: 11px;
      outline: none;
      font-family: Inter;
    }

    input:focus,
    textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(0,245,255,.08);
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    form button {
      padding: 16px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(90deg,var(--cyan),var(--blue));
      color: #02050b;
      font-weight: 800;
      cursor: pointer;
    }

    /* ==============================
       FOOTER
    ============================== */

    footer {
      padding: 35px 6%;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,.07);
      color: #596173;
      font-size: 11px;
    }

    footer span {
      color: var(--cyan);
    }

    /* ==============================
       RESPONSIVE
    ============================== */

    @media(max-width: 950px) {

      .nav-links {
        display: none;
      }

      .hero {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .hero p {
        margin-left: auto;
        margin-right: auto;
      }

      .hero-actions {
        justify-content: center;
      }

      .holo-stage {
        margin-top: 20px;
      }

      .programs {
        grid-template-columns: 1fr 1fr;
      }

      .plans {
        grid-template-columns: 1fr;
      }

      .plan.featured {
        transform: none;
      }

      .experience,
      .contact {
        grid-template-columns: 1fr;
      }
    }

    @media(max-width: 600px) {

      header {
        padding: 12px 4%;
      }

      nav {
        height: 58px;
      }

      .hero {
        padding-left: 5%;
        padding-right: 5%;
      }

      .hero h1 {
        font-size: 55px;
        letter-spacing: -4px;
      }

      .holo-stage {
        transform: scale(.78);
        margin-top: -20px;
        margin-bottom: -70px;
      }

      .programs {
        grid-template-columns: 1fr;
      }

      .section-head {
        display: block;
      }

      .section-head p {
        margin-top: 15px;
      }

      .contact h2 {
        font-size: 40px;
      }
    }
  </style>
</head>
